<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <link rel="stylesheet" href="sign.css">    
</head>
<body>
    <a href="index.html" class="sign">Back To Home</a>
    <div class="container">
        
        <div class="logo">
            <img src="amazon_logo.png" alt="Amazon Logo">
        </div>
        <div class="signin-box">
            <h2>Sign-In</h2>
            <form onsubmit="showAlert(event)" id="sign">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Sign-In</button>
                
                <p class="help"><a href="check.html">Forgot your password? click me</a></p>
            </form>
            
            <p class="new-user">New to Amazon? <a href="#">Create your Amazon account</a></p>
        </div>
    </div>
</body>
<script>
    function showAlert(event) {
        event.preventDefault();
        const Email1 = "rajat@123";
        const Password = "rajat12";

        const enteredEmail = document.getElementById("email").value;
        const enteredPassword = document.getElementById("password").value;
        
        if (enteredEmail === Email1 && enteredPassword === Password) {
            alert("Sign-In Successful!");
            document.getElementById("sign").reset();
        } else {
            alert("Invalid data. Please try again.");
        }
    }
</script>
</html>
