<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now - Amazon Clone</title>
    <link rel="stylesheet" href="buy.css">
</head>
<body>

    <header>
        <div class="logo">Amazon Clone</div>
        <a href="IThtml.html" class="home-button">Back To Home</a>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <h2>Enter Your Details</h2>
                <form onsubmit="showAlert(event)" id="buyForm">
                    <label for="product">Product Name:</label>
                    <input type="text" id="product" name="product" placeholder="Enter product name" required>

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="phone">Phone Number:</label>
                    <input type="text" min="0" maxlength="10" id="phone" name="phone" placeholder="Enter your phone number" required
                     oninput="this.value =this.value.replace(/[^0-9]/g, '')" />

                    <label for="address">Address:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter your address" required></textarea>

                    <button type="submit" class="buy-now">Buy Now</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Amazon Clone. All rights reserved.</p>
    </footer>

    <script>
        function showAlert(event) {
            event.preventDefault(); 
            alert("Thanks for buying.");
            document.getElementById("buyForm").reset();
        }
    </script>
</body>
</html>
